version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: url-shortener-db
    environment:
      - POSTGRES_DB=UrlShortenerDb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - url-shortener-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  api1:
    build:
      context: .
      dockerfile: src/Api/Dockerfile
    container_name: url-shortener-api1
    ports:
      - "5001:5000"   # HTTP
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - DOCKER_ENV=true
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=UrlShortenerDb;Username=postgres;Password=postgres;Pooling=true;Minimum Pool Size=0;Maximum Pool Size=100;Connection Lifetime=0;Timeout=30;Command Timeout=30
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - url-shortener-network

  api2:
    build:
      context: .
      dockerfile: src/Api/Dockerfile
    container_name: url-shortener-api2
    ports:
      - "5002:5000"   # HTTP
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - DOCKER_ENV=true
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=UrlShortenerDb;Username=postgres;Password=postgres;Pooling=true;Minimum Pool Size=0;Maximum Pool Size=100;Connection Lifetime=0;Timeout=30;Command Timeout=30
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - url-shortener-network

  gateway:
    build:
      context: .
      dockerfile: gateway/Gateway/Dockerfile
    container_name: url-shortener-gateway
    ports:
      - "8080:8080"   # HTTP
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - DOCKER_ENV=true
    depends_on:
      - api1
      - api2
    networks:
      - url-shortener-network

volumes:
  postgres-data:

networks:
  url-shortener-network:
    driver: bridge